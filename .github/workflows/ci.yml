name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-flight runs on the same ref so PR pushes don't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep cold-build noise (compiled deps progress) out of step logs.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            artifact_ext: .exe
            run_tests: true
          - target: aarch64-pc-windows-msvc
            # `windows-11-arm` is GitHub's hosted ARM64 Windows runner
            # (public preview as of 2025). If it ever disappears or
            # times out, swap for `windows-2022` and add
            # `cross_compile: true` so the build target differs from
            # the host arch.
            runner: windows-11-arm
            artifact_ext: .exe
            run_tests: true
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            artifact_ext: ''
            run_tests: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            artifact_ext: ''
            run_tests: true

    steps:
      - uses: actions/checkout@v4

      - name: Install rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted runners ship rustup, so install the toolchain with
          # it directly instead of a third-party action. `stable` tracks the
          # latest stable release, matching the previous behavior.
          rustup toolchain install stable \
            --profile minimal \
            --component clippy \
            --target ${{ matrix.target }}
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Bust cache when the lockfile or rust version changes.
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.toml') }}-v1
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: clippy
        # `-D warnings` makes any clippy warning fail the build; we
        # already keep the tree warning-free.
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: test
        if: matrix.run_tests
        # Tests live in term-common (126) + term-agent (14); the other
        # crates have no unit tests yet (covered by integration tests
        # in a follow-up). `--workspace` still runs all of them.
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: build release
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: collect binaries
        shell: bash
        env:
          EXT: ${{ matrix.artifact_ext }}
          TGT: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for b in term-hub term-agent hub-admin term-dl; do
            src="target/${TGT}/release/${b}${EXT}"
            if [[ -f "$src" ]]; then
              cp "$src" "artifacts/${b}${EXT}"
            else
              echo "MISSING: $src" >&2
              exit 1
            fi
          done
          ls -la artifacts

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: term-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          # 14 days is enough to download a CI build for manual smoke
          # testing without storing forever.
          retention-days: 14

  # ---------------------------------------------------------------------
  # Linux-only formatting + dep audit. Runs in parallel with build.
  # ---------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          cargo --version

      # The repo doesn't currently enforce rustfmt style; we still run
      # `--check` so any drift shows up as a non-blocking warning. To
      # promote to a hard error: change `continue-on-error: true` to
      # `false` and commit a rustfmt.toml.
      - name: rustfmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo tree (no openssl)
        # Belt-and-braces: Phase 4.4 removed openssl-sys; if a future
        # change reintroduces it (e.g. via a new dep), fail loudly here
        # rather than discover it in a Windows build later.
        run: |
          set -euo pipefail
          if cargo tree --workspace --format '{p}' | grep -E '^(openssl|openssl-sys|webauthn-rs)\b' ; then
            echo "::error::reintroduced openssl/webauthn-rs as a dep" >&2
            exit 1
          fi
          echo "ok: no openssl/webauthn-rs in the dep tree"

  # ---------------------------------------------------------------------
  # Publish a GitHub prerelease with the built binaries on every green
  # pipeline run. Gated on build + lint succeeding, and only for pushes
  # to main / manual dispatch — never pull_request, since fork PRs get a
  # read-only GITHUB_TOKEN and couldn't create a release anyway.
  #
  # Cargo's version is a static 0.1.0, so each run gets a unique,
  # non-colliding tag: v<version>-build.<run-number>+<short-sha>.
  # Releases are marked prerelease so they never become the repo's
  # "Latest" until a real, version-tagged release is cut.
  # ---------------------------------------------------------------------
  release:
    name: release
    needs: [build, lint]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Least privilege: only this job needs write access to cut a release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # Pull the workspace version straight from Cargo.toml so the tag
          # tracks the real version once it's bumped past 0.1.0.
          version="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ -z "${version}" ]]; then
            echo "::error::could not parse version from Cargo.toml" >&2
            exit 1
          fi
          short_sha="${GITHUB_SHA:0:7}"
          tag="v${version}-build.${{ github.run_number }}+${short_sha}"
          name="v${version} build ${{ github.run_number }}"
          {
            echo "version=${version}"
            echo "short_sha=${short_sha}"
            echo "tag=${tag}"
            echo "name=${name}"
          } >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag}"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          # Each target uploaded a `term-<target>` artifact; pull them all
          # into their own subdirs (no merge — same binary names collide).
          pattern: term-*
          path: dist

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release
          # Flatten dist/term-<target>/<bin>[.exe] -> release/<bin>-<target>[.exe]
          # so every asset has a unique, target-qualified name.
          for dir in dist/term-*/; do
            target="$(basename "$dir")"
            target="${target#term-}"
            for f in "$dir"*; do
              base="$(basename "$f")"
              case "$base" in
                *.exe) cp "$f" "release/${base%.exe}-${target}.exe" ;;
                *)     cp "$f" "release/${base}-${target}" ;;
              esac
            done
          done
          if [[ -z "$(ls -A release)" ]]; then
            echo "::error::no binaries staged for release" >&2
            exit 1
          fi
          # Checksums so downloads can be verified. `*` is globbed before
          # the redirect creates SHA256SUMS.txt, so it isn't self-hashed.
          ( cd release && sha256sum -- * > SHA256SUMS.txt )
          echo "Release assets:"
          ls -la release

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.name }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          # `gh` is preinstalled on GitHub-hosted runners; use it instead of a
          # third-party release action. The contents:write permission set on
          # this job lets the default GITHUB_TOKEN create the release + tag.
          cat > release-notes.md <<EOF
          Automated build of \`${GITHUB_REF_NAME}\` @ \`${SHORT_SHA}\`.

          - Commit: ${GITHUB_SHA}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Binaries: \`term-hub\`, \`term-agent\`, \`hub-admin\`, \`term-dl\`
          - Targets: x86_64 / aarch64 × Linux (gnu) / Windows (msvc)

          Verify downloads against \`SHA256SUMS.txt\`.
          EOF
          gh release create "$TAG" \
            --title "$TITLE" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md \
            release/*
