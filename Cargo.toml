[workspace]
resolver = "2"
members = ["common", "agent", "hub", "hub-admin", "term-dl"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
serde            = { version = "1", features = ["derive"] }
serde_json       = { version = "1" }
tokio            = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "fs", "signal", "process", "time", "sync"] }
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow           = "1"
thiserror        = "2"
base64           = "0.22"
hmac             = "0.13"
sha2             = "0.11"
rand             = "0.10"
url              = "2"
toml             = "1"
uuid             = { version = "1", features = ["v4", "serde"] }
p256             = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rustls-pemfile   = "2"
rustls-pki-types = "1"
rcgen            = { version = "0.13", default-features = false, features = ["pem", "aws_lc_rs", "x509-parser"] }
x509-parser      = "0.16"
ring             = "0.17"

[profile.release]
lto = "thin"
codegen-units = 1
# Emit full debug info so we get rich PDBs on Windows MSVC and a
# detached DWARF package on Linux.
debug = "full"
# Move debug info into a sibling file (.pdb on Windows MSVC, .dwp on
# Linux). Keeps the shipped binary small without losing
# stepable-source / symbolicated stack traces.
split-debuginfo = "packed"
# After split-debuginfo has hoisted DWARF into the .dwp, scrub any
# leftover debug sections from the ELF binary itself. On Windows MSVC
# debug data already lives in the PDB, so this is a no-op there.
strip = "debuginfo"
