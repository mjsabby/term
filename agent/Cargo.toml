[package]
name = "term-agent"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "term-agent"
path = "src/main.rs"

[dependencies]
tokio              = { workspace = true }
tokio-rustls       = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls             = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
rustls-pemfile     = { workspace = true }
webpki-roots       = "1"
ring               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }
base64             = { workspace = true }
portable-pty       = "0.9"
url                = { workspace = true }
futures-util       = { version = "0.3", default-features = false }
## WebSocket *client* for dialing the hub through an HTTP/WS perimeter
## (Dev Tunnel). `handshake` only — we bring our own TLS via tokio-rustls
## (ring), so no native-tls / rustls feature here (avoids a second crypto
## provider in the binary).
tokio-tungstenite  = { version = "0.29", default-features = false, features = ["handshake"] }
term-common        = { path = "../common", default-features = false }

[target.'cfg(unix)'.dependencies]
libc               = "0.2"
