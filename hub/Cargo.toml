[package]
name = "term-hub"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "term-hub"
path = "src/main.rs"

[dependencies]
axum               = { version = "0.8", features = ["ws", "macros"] }
axum-server        = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
tokio              = { workspace = true }
tokio-stream       = { version = "0.1", default-features = false }
tokio-rustls       = { version = "0.26", default-features = false }
rustls             = { version = "0.23", default-features = false, features = ["aws-lc-rs", "tls12", "std"] }
rustls-pemfile     = "2"
tower-http         = { version = "0.6", features = ["trace"] }
rust-embed         = { version = "8", features = ["mime-guess"] }
rustls-acme        = { version = "0.15", default-features = false, features = ["aws-lc-rs", "tls12", "webpki-roots", "axum"] }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }
uuid               = { workspace = true }
rand               = { workspace = true }
url                = { workspace = true }
base64             = { workspace = true }
hmac               = { workspace = true }
sha2               = { workspace = true }
futures-util       = { version = "0.3", default-features = false }
http               = "1"
term-common        = { path = "../common" }

[dev-dependencies]
tower              = { version = "0.5", features = ["util"] }
## WebSocket client for the /agent/connect end-to-end test. `handshake`
## only — the test speaks plain ws:// over a loopback TcpStream.
tokio-tungstenite  = { version = "0.29", default-features = false, features = ["handshake"] }
